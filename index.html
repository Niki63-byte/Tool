<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lyrqos — Beta 1.3 (Zilla/RTX)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);background-attachment:fixed;color:#fff;min-height:100vh;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit}

  /* Particles & Nav */
  .particles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .particle{position:absolute;background:rgba(255,255,255,0.5);border-radius:50%;animation:float linear infinite}
  @keyframes float{from{transform:translateY(100vh) scale(0);opacity:0}to{transform:translateY(-10vh) scale(1);opacity:1}}
  nav{position:sticky;top:0;z-index:100;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;background:rgba(15,12,41,0.75);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.06)}
  nav .logo{font-size:20px;font-weight:800;background:linear-gradient(90deg,#00f5a0,#00d9f5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px;cursor:pointer;display:flex;align-items:center;gap:8px}
  .beta-tag{font-size:9px;padding:2px 6px;background:rgba(255,200,50,0.2);color:#ffd060;border:1px solid rgba(255,200,50,0.4);border-radius:4px;letter-spacing:1px;-webkit-text-fill-color:#ffd060;font-weight:700}
  nav ul{display:flex;gap:2px;list-style:none;align-items:center;flex-wrap:wrap}
  nav ul a{padding:8px 12px;border-radius:100px;font-size:12px;color:rgba(255,255,255,0.7);transition:.3s;white-space:nowrap;cursor:pointer}
  nav ul a:hover{color:#00f5a0;background:rgba(0,245,160,0.08)}
  nav ul a.active{color:#0f0c29;background:linear-gradient(90deg,#00f5a0,#00d9f5);font-weight:600}

  /* Pages & Sections */
  .page{display:none;position:relative;z-index:1;animation:fadeIn .3s ease}
  .page.active{display:block}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .hero{min-height:60vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:40px 20px}
  .hero h1{font-size:clamp(32px,6vw,64px);background:linear-gradient(90deg,#00f5a0,#00d9f5,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:16px;line-height:1.1}
  .hero p{font-size:clamp(14px,1.6vw,17px);opacity:0.8;margin-bottom:28px;max-width:600px;line-height:1.6}
  .btn{padding:12px 28px;border-radius:50px;background:linear-gradient(90deg,#00f5a0,#00d9f5);color:#0f0c29;font-size:14px;font-weight:700;transition:.3s}
  .btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,245,160,0.4)}
  .btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.2)}
  .btn.ghost:hover{border-color:#00f5a0;color:#00f5a0;box-shadow:none}
  .section{max-width:1200px;margin:0 auto;padding:40px 20px}
  .section-title{font-size:clamp(24px,3vw,36px);text-align:center;margin-bottom:8px;background:linear-gradient(90deg,#00f5a0,#00d9f5);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .section-sub{text-align:center;opacity:0.7;margin-bottom:32px;font-size:14px}

  /* Tools Grid */
  .tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .tool-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:20px;cursor:pointer;transition:.3s;position:relative;overflow:hidden}
  .tool-card:hover{transform:translateY(-4px);background:rgba(255,255,255,0.07);border-color:rgba(0,245,160,0.4)}
  .tool-card .tool-icon{font-size:26px;margin-bottom:8px;display:block}
  .tool-card h3{font-size:15px;margin-bottom:4px}
  .tool-card p{font-size:11.5px;opacity:0.6;line-height:1.4}
  .tool-badge{position:absolute;top:10px;right:10px;font-size:8px;padding:2px 6px;border-radius:4px;font-weight:700}
  .tool-badge.hot{background:rgba(255,80,80,0.15);color:#ff8080}
  .tool-badge.new{background:rgba(0,245,160,0.15);color:#00f5a0}

  /* Modal & UI */
  .modal-overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
  .modal-overlay.open{display:flex}
  .modal{background:linear-gradient(135deg,#1a1740,#24243e);border:1px solid rgba(255,255,255,0.1);border-radius:16px;max-width:760px;width:100%;padding:24px;max-height:90vh;overflow-y:auto;position:relative}
  .modal-close{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.6);display:flex;align-items:center;justify-content:center}
  .modal h2{font-size:18px;margin-bottom:4px;color:#00f5a0}
  .modal .modal-sub{font-size:12px;opacity:0.6;margin-bottom:16px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1px;opacity:0.6;margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;padding:9px 12px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#fff;font-size:12.5px;outline:none;font-family:inherit}
  .btn-sm{padding:8px 14px;border-radius:6px;background:linear-gradient(90deg,#00f5a0,#00d9f5);color:#0f0c29;font-weight:700;font-size:11px;transition:.2s;display:inline-flex;align-items:center;gap:4px}
  .btn-sm:hover{transform:translateY(-1px)}
  .btn-sm.ghost{background:rgba(255,255,255,0.06);color:#fff;border:1px solid rgba(255,255,255,0.1)}
  .tool-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .tool-output{background:rgba(0,0,0,0.4);border-radius:8px;padding:10px;font-family:monospace;font-size:11px;color:#b8ffd8;margin-top:10px;max-height:180px;overflow:auto;white-space:pre-wrap}
  .image-upload{border:2px dashed rgba(0,245,160,0.3);border-radius:10px;padding:20px;text-align:center;cursor:pointer;transition:.3s}
  .image-upload:hover{border-color:#00f5a0;background:rgba(0,245,160,0.05)}
  .image-upload.has-image{padding:0;border-style:solid;overflow:hidden;background:#0a0818}
  .image-upload img,.image-upload canvas{width:100%;display:block;max-height:280px;object-fit:contain}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:linear-gradient(90deg,#00f5a0,#00d9f5);color:#0f0c29;padding:10px 20px;border-radius:100px;font-weight:700;font-size:12px;z-index:2000;transition:.3s;box-shadow:0 10px 30px rgba(0,245,160,0.4)}
  .toast.show{transform:translateX(-50%) translateY(0)}

  /* IDE */
  .ide-window{background:#0d0b1f;border:1px solid rgba(255,255,255,0.08);border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.5);font-family:'JetBrains Mono',monospace;font-size:13px;max-width:1200px;margin:0 auto}
  .ide-header{display:flex;align-items:center;padding:8px 14px;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.06);height:38px}
  .window-dots{display:flex;gap:6px}.window-dots span{width:10px;height:10px;border-radius:50%}
  .dot-red{background:#ff5f56}.dot-yellow{background:#ffbd2e}.dot-green{background:#27c93f}
  .ide-body{display:flex;height:400px;position:relative;background:#0d0b1f}
  .ide-gutter{width:44px;background:rgba(0,0,0,0.2);padding:12px 8px 12px 0;text-align:right;color:rgba(255,255,255,0.2);font-size:12px;line-height:1.6;user-select:none}
  .ide-code-pane{position:relative;flex:1;overflow:hidden}
  .ide-highlight-layer,.ide-textarea{position:absolute;inset:0;padding:12px 16px;font-family:inherit;font-size:inherit;line-height:1.6;white-space:pre;border:none;outline:none;tab-size:2}
  .ide-highlight-layer{color:#f8f8f2;pointer-events:none;z-index:0;overflow:auto}
  .ide-textarea{background:transparent;color:transparent;caret-color:#00f5a0;resize:none;z-index:2;overflow:auto}
  .ide-textarea::selection{background:rgba(0,245,160,0.2)}
  .tok-keyword{color:#ff79c6}.tok-string{color:#50fa7b}.tok-comment{color:#6272a4}.tok-number{color:#ffb86c}.tok-function{color:#8be9fd}
  .action-bar{display:flex;gap:8px;padding:10px 14px;background:rgba(0,0,0,0.15);border-top:1px solid rgba(255,255,255,0.04);flex-wrap:wrap}
  .action-btn{padding:8px 16px;border-radius:6px;background:linear-gradient(90deg,#00f5a0,#00d9f5);color:#0f0c29;font-weight:700;font-size:11.5px;transition:.2s}
  .action-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,245,160,0.3)}
  .action-btn.ghost{background:rgba(255,255,255,0.06);color:#fff;border:1px solid rgba(255,255,255,0.1)}
  .issues-panel{margin-top:16px;background:rgba(0,0,0,0.25);border-radius:10px;overflow:hidden}
  .issue-list{padding:10px;max-height:200px;overflow-y:auto}
  .issue{padding:10px;border-radius:6px;background:rgba(255,255,255,0.02);border-left:3px solid;font-size:12px;margin-bottom:6px;cursor:pointer}
  .issue.error{border-color:#ff5050}.issue.warning{border-color:#ffc832}.issue.info{border-color:#64b4ff}

  @media(max-width:768px){
    nav ul li.hide-m{display:none}
    .ide-body{height:300px}
    .tools-grid{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>

<div class="particles" id="particles"></div>

<nav>
  <div class="logo" data-nav="home">LYRQOS<span class="beta-tag">BETA</span></div>
  <ul>
    <li><a href="#/home" data-nav="home" class="active">Главная</a></li>
    <li><a href="#/editor" data-nav="editor">IDE</a></li>
    <li><a href="#/tools" data-nav="tools">Инструменты</a></li>
  </ul>
</nav>

<!-- HOME -->
<div class="page active" id="page-home">
  <section class="hero">
    <h1>Оптимизатор TikTok</h1>
    <p>Патчим контейнер MP4/MOV методом Zilla/RTX: обнуляем длительность (0 секунд) и меняем timescale, чтобы TikTok не сжимал видео и не отправлял в теневой бан.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
      <button class="btn" data-nav="tools">Открыть инструменты</button>
      <button class="btn ghost" data-nav="editor">Открыть IDE</button>
    </div>
  </section>
</div>

<!-- IDE -->
<div class="page" id="page-editor">
  <div class="section">
    <h2 class="section-title">Lyrqos IDE</h2>
    <div class="ide-window">
      <div class="ide-header">
        <div class="window-dots"><span class="dot-red"></span><span class="dot-yellow"></span><span class="dot-green"></span></div>
        <div style="flex:1;text-align:center;font-size:11px;opacity:0.5">main.js — BETA</div>
      </div>
      <div class="ide-body">
        <div class="ide-gutter" id="gutter"></div>
        <div class="ide-code-pane">
          <div class="ide-highlight-layer" id="highlight-layer"><code id="highlight-code"></code></div>
          <textarea class="ide-textarea" id="code-input" spellcheck="false" wrap="off"></textarea>
        </div>
      </div>
      <div class="action-bar">
        <button class="action-btn" id="btn-analyze">🔍 Анализ кода</button>
        <button class="action-btn ghost" id="btn-example">📄 Пример</button>
        <button class="action-btn ghost" id="btn-clear">🗑 Очистить</button>
      </div>
    </div>
    <div class="issues-panel">
      <div class="issue-list" id="issue-list"><div style="text-align:center;padding:20px;opacity:0.5;font-size:12px;">Проблем не найдено</div></div>
    </div>
  </div>
</div>

<!-- TOOLS -->
<div class="page" id="page-tools">
  <div class="section">
    <h2 class="section-title">Инструменты</h2>
    <div class="tools-grid" id="tools-grid"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="tool-modal">
  <div class="modal">
    <button class="modal-close" id="tool-modal-close">✕</button>
    <h2 id="tool-modal-title">Инструмент</h2>
    <p class="modal-sub" id="tool-modal-sub"></p>
    <div id="tool-modal-content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

// Particles
const pEl = document.getElementById('particles');
for(let i=0;i<20;i++){const p=document.createElement('div');p.className='particle';const s=Math.random()*3+2;p.style.width=s+'px';p.style.height=s+'px';p.style.left=Math.random()*100+'%';p.style.animationDuration=(Math.random()*15+10)+'s';p.style.animationDelay=(Math.random()*10)+'s';pEl.appendChild(p);}

const escapeHtml = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toastEl = document.getElementById('toast');
let tTimer;
function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(tTimer);tTimer=setTimeout(()=>toastEl.classList.remove('show'),2200);}

// Router
function navigate(page){
  page = page || 'home';
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  (document.getElementById('page-'+page)||document.getElementById('page-home')).classList.add('active');
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active', a.dataset.nav===page));
  window.scrollTo(0,0);
  if(page==='tools') renderTools();
  if(page==='editor') refreshHighlight();
}
window.addEventListener('hashchange', ()=>navigate(location.hash.replace(/^#\/?/,'')||'home'));
document.querySelectorAll('[data-nav]').forEach(el=>{
  el.addEventListener('click', e=>{e.preventDefault(); location.hash = '#/'+el.dataset.nav;});
});

// IDE Logic
const textarea = document.getElementById('code-input');
const highlightCode = document.getElementById('highlight-code');
const highlightLayer = document.getElementById('highlight-layer');
const gutter = document.getElementById('gutter');
const issueList = document.getElementById('issue-list');

function highlight(code){
  let h = escapeHtml(code);
  h = h.replace(/(\/\/[^\n]*)/g, '<span class="tok-comment">$1</span>');
  h = h.replace(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g, '<span class="tok-string">$1</span>');
  h = h.replace(/\b(var|let|const|function|return|if|else|for|while|new|class|this|typeof|try|catch|throw)\b/g, '<span class="tok-keyword">$1</span>');
  h = h.replace(/\b(\d+)\b/g, '<span class="tok-number">$1</span>');
  h = h.replace(/\b(console|document|window|Math|JSON|eval)\b/g, '<span class="tok-function">$1</span>');
  return h;
}
function refreshHighlight(){
  if(!textarea.value) textarea.value = `var user = "admin";\nif(user == "admin"){\n  document.write("Hello");\n}\neval("alert(1)");`;
  highlightCode.innerHTML = highlight(textarea.value) + '\n';
  const lines = textarea.value.split('\n').length;
  gutter.innerHTML = Array.from({length:lines}, (_,i)=>`<div>${i+1}</div>`).join('');
}
textarea.addEventListener('input', refreshHighlight);
textarea.addEventListener('scroll', ()=>{highlightLayer.scrollTop=textarea.scrollTop;highlightLayer.scrollLeft=textarea.scrollLeft;gutter.scrollTop=textarea.scrollTop;});
document.getElementById('btn-example').onclick = ()=>{textarea.value=`var user = "admin";\nif(user == "admin"){\n  document.write("Hello");\n}\neval("alert(1)");`;refreshHighlight();};
document.getElementById('btn-clear').onclick = ()=>{textarea.value='';refreshHighlight();issueList.innerHTML='';};
document.getElementById('btn-analyze').onclick = ()=>{
  const lines = textarea.value.split('\n');
  const issues = [];
  lines.forEach((l,i)=>{
    if(/\beval\s*\(/.test(l)) issues.push({l:i+1,s:'error',m:'eval() — RCE уязвимость'});
    if(/document\.write/.test(l)) issues.push({l:i+1,s:'error',m:'document.write() устарел'});
    if(/\bvar\s+/.test(l)) issues.push({l:i+1,s:'warning',m:'var — используй let/const'});
    if(/(?<![=!])==(?!=)/.test(l)) issues.push({l:i+1,s:'warning',m:'== — используй ==='});
  });
  if(!issues.length) issueList.innerHTML = '<div style="text-align:center;padding:20px;color:#00f5a0;font-size:12px;">✓ Код чист</div>';
  else {
    issueList.innerHTML = issues.map(x=>`<div class="issue ${x.s}"><strong>Стр ${x.l}</strong>: ${x.m}</div>`).join('');
    toast('Найдено: '+issues.length);
  }
};

// Tools Logic
const TOOLS = [
  {id:'tiktok-opt', icon:'🎬', title:'TikTok Optimizer', desc:'Метод 0 секунд (Zilla/RTX)', badge:'hot'},
  {id:'ai-upscale', icon:'📸', title:'AI Upscale', desc:'Улучшение фото (Clipdrop)', badge:'new'},
  {id:'local-image', icon:'✨', title:'Резкость фото', desc:'Локальный sharpen'},
  {id:'password', icon:'🔑', title:'Пароли', desc:'Криптостойкая генерация'},
  {id:'json', icon:'📋', title:'JSON', desc:'Форматирование'}
];

function renderTools(){
  const grid = document.getElementById('tools-grid');
  if(grid.children.length) return;
  grid.innerHTML = TOOLS.map(t=>`
    <div class="tool-card" onclick="openTool('${t.id}')">
      ${t.badge?`<span class="tool-badge ${t.badge}">${t.badge.toUpperCase()}</span>`:''}
      <span class="tool-icon">${t.icon}</span>
      <h3>${t.title}</h3><p>${t.desc}</p>
    </div>
  `).join('');
}

const toolModal = document.getElementById('tool-modal');
document.getElementById('tool-modal-close').onclick = ()=>toolModal.classList.remove('open');
toolModal.onclick = e=>{if(e.target===toolModal)toolModal.classList.remove('open');};

window.openTool = function(id){
  const t = TOOLS.find(x=>x.id===id);
  document.getElementById('tool-modal-title').textContent = t.title;
  document.getElementById('tool-modal-sub').textContent = t.desc;
  const content = document.getElementById('tool-modal-content');
  content.innerHTML = '';
  toolModal.classList.add('open');
  TOOL_BUILDERS[id](content);
};

const TOOL_BUILDERS = {
  'tiktok-opt'(el){
    el.innerHTML = `
      <div class="image-upload" id="tt-drop" onclick="document.getElementById('tt-file').click()">
        <div style="font-size:30px">🎬</div><div style="font-size:12px;margin-top:6px">Нажми или перетащи MP4/MOV</div>
      </div>
      <input type="file" id="tt-file" accept="video/mp4,video/quicktime" style="display:none">
      <div id="tt-info" style="display:none;font-size:12px;margin:10px 0;opacity:0.8"></div>
      <div id="tt-controls" style="display:none">
        <div style="background:rgba(255,80,80,0.1);border:1px solid rgba(255,80,80,0.3);border-radius:8px;padding:10px;margin-bottom:12px;font-size:11px;line-height:1.5;">
          <strong style="color:#ff8080">Внимание:</strong> Включен метод <b>Zilla/RTX</b>. Длительность будет установлена на <b>0 секунд</b>. Видео будет показывать 0:00 в галерее, но TikTok пропустит его без сжатия.
        </div>
        <label style="display:block;font-size:12px;margin-bottom:8px;cursor:pointer"><input type="checkbox" id="tt-zero" checked> Обнулить длительность (0 секунд)</label>
        <label style="display:block;font-size:12px;margin-bottom:12px;cursor:pointer"><input type="checkbox" id="tt-inflate" checked> Сбить Timescale (обход битрейта)</label>
        <button class="btn-sm" id="tt-run" style="width:100%;justify-content:center">⚡ Патчить видео</button>
      </div>
      <div class="tool-output" id="tt-out" style="display:none"></div>
      <div class="tool-row"><button class="btn-sm ghost" id="tt-dl" style="display:none;width:100%;justify-content:center">⬇ Скачать оптимизированный MP4</button></div>
    `;
    const fileIn = document.getElementById('tt-file');
    let origFile = null, patchedBlob = null;

    fileIn.onchange = e=>{
      if(!e.target.files[0]) return;
      origFile = e.target.files[0];
      document.getElementById('tt-info').style.display = 'block';
      document.getElementById('tt-info').innerHTML = `📁 <b>${origFile.name}</b> (${(origFile.size/1024/1024).toFixed(1)} MB)`;
      document.getElementById('tt-controls').style.display = 'block';
      document.getElementById('tt-dl').style.display = 'none';
      document.getElementById('tt-out').style.display = 'none';
    };

    document.getElementById('tt-run').onclick = async ()=>{
      if(!origFile) return;
      const btn = document.getElementById('tt-run');
      btn.textContent = '⏳ Обработка...'; btn.disabled = true;
      
      try {
        const buf = await origFile.arrayBuffer();
        const zeroDur = document.getElementById('tt-zero').checked;
        const inflate = document.getElementById('tt-inflate').checked;
        
        // Вызываем патчер
        const res = await patchMP4(buf, zeroDur, inflate);
        
        patchedBlob = new Blob([res], {type:'video/mp4'});
        document.getElementById('tt-out').style.display = 'block';
        document.getElementById('tt-out').textContent = '✓ Патч Zilla/RTX успешно применён!\nДлительность: 0 сек\nРазмер: ' + (patchedBlob.size/1024/1024).toFixed(2) + ' MB';
        document.getElementById('tt-dl').style.display = 'inline-flex';
        toast('Готово (0 секунд)');
      } catch(e) {
        document.getElementById('tt-out').style.display = 'block';
        document.getElementById('tt-out').textContent = '❌ Ошибка: ' + e.message;
      } finally {
        btn.textContent = '⚡ Патчить видео'; btn.disabled = false;
      }
    };

    document.getElementById('tt-dl').onclick = ()=>{
      if(!patchedBlob) return;
      const a = document.createElement('a'); a.href = URL.createObjectURL(patchedBlob);
      a.download = 'zilla_rtx_' + origFile.name; a.click(); toast('Скачано');
    };
  },

  'ai-upscale'(el){
    el.innerHTML = `
      <div class="image-upload" onclick="document.getElementById('ai-file').click()" id="ai-drop">
        <div style="font-size:30px">📸</div><div style="font-size:12px;margin-top:6px">Загрузить фото</div>
      </div>
      <input type="file" id="ai-file" accept="image/*" style="display:none">
      <div class="field" style="margin-top:12px"><label>Clipdrop API Key</label><input type="password" id="ai-key" placeholder="Вставь ключ..."></div>
      <button class="btn-sm" id="ai-run" style="width:100%;justify-content:center" disabled>🤖 AI Upscale 2x</button>
      <div id="ai-res" style="margin-top:10px"></div>
    `;
    document.getElementById('ai-file').onchange = e=>{
      const f = e.target.files[0]; if(!f) return;

      img.classList.add('has-image');

    };
    document.getElementById('ai-run').onclick = async ()=>{
      const key = document.getElementById('ai-key').value.trim();
      if(!key) { toast('Введи ключ'); return; }
      const file = document.getElementById('ai-file').files[0];
      const btn = document.getElementById('ai-run'); btn.textContent='⏳...';
      try {
        const form = new FormData(); form.append('image_file', file);
        const img = await createImageBitmap(file);
        form.append('target_width', Math.round(img.width*2));
        form.append('target_height', Math.round(img.height*2));
        const r = await fetch('https://clipdrop-api.co/image-upscaling/v1/upscale', {method:'POST', headers:{'x-api-key':key}, body:form});
        if(!r.ok) throw new Error('Ключ неверный или лимит');
        const blob = await r.blob();
        document.getElementById('ai-res').innerHTML = `<img src="${URL.createObjectURL(blob)}" style="width:100%;border-radius:10px">`;
        toast('Успешно!');
      } catch(e) { toast(e.message); }
      finally { btn.textContent='🤖 AI Upscale 2x'; }
    };
  },

  'local-image'(el){
    el.innerHTML = `
      <div class="image-upload" onclick="document.getElementById('li-file').click()" id="li-drop">
        <div style="font-size:30px">✨</div><div style="font-size:12px;margin-top:6px">Загрузить фото</div>
      </div>
      <input type="file" id="li-file" accept="image/*" style="display:none">
      <div class="field" style="margin-top:12px"><label>Резкость</label><input type="range" id="li-sharp" min="0" max="100" value="50"></div>
    `;
    let canvas, ctx, origData;
    document.getElementById('li-file').onchange = e=>{
      const f = e.target.files[0]; if(!f) return;
      const reader = new FileReader();
      reader.onload = ev=>{
        const img = new Image();
        img.onload = ()=>{
          canvas = document.createElement('canvas'); canvas.width=img.width; canvas.height=img.height;
          ctx = canvas.getContext('2d'); ctx.drawImage(img,0,0);
          origData = ctx.getImageData(0,0,img.width,img.height);
          const drop = document.getElementById('li-drop');
          drop.innerHTML=''; drop.appendChild(canvas); drop.classList.add('has-image');
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(f);
    };
    document.getElementById('li-sharp').oninput = e=>{
      if(!ctx) return;
      const amt = e.target.value / 100;
      const data = new ImageData(new Uint8ClampedArray(origData.data), origData.width, origData.height);
      if(amt > 0){
        const s = data.data, o = new Uint8ClampedArray(s);
        const k = amt, c = 1+4*k, side = -k;
        for(let y=1;y<data.height-1;y++) for(let x=1;x<data.width-1;x++){
          const i = (y*data.width+x)*4;
          for(let j=0;j<3;j++) o[i+j] = Math.max(0, Math.min(255, s[i+j]*c + s[i+j-4]*side + s[i+j+4]*side + s[i+j-data.width*4]*side + s[i+j+data.width*4]*side));
        }
        ctx.putImageData(new ImageData(o, data.width, data.height), 0, 0);
      } else { ctx.putImageData(origData, 0, 0); }
    };
  },

  'password'(el){
    el.innerHTML = `

    `;
    const gen = ()=>{
      const len = document.getElementById('pw-len').value;
      document.getElementById('pw-lv').textContent = len;
      const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()';
      const arr = new Uint32Array(len); crypto.getRandomValues(arr);
      let pw = ''; for(let i=0;i<len;i++) pw += chars[arr[i]%chars.length];
      document.getElementById('pw-out').textContent = pw;
    };
    document.getElementById('pw-len').oninput = gen;
    document.getElementById('pw-gen').onclick = gen; gen();
  },

  'json'(el){
    el.innerHTML = `
      <div class="field"><label>JSON</label><textarea id="js-in" style="min-height:100px"></textarea></div>
      <button class="btn-sm" id="js-fmt" style="width:100%;justify-content:center">Форматировать</button>
      <div class="tool-output" id="js-out"></div>
    `;
    document.getElementById('js-fmt').onclick = ()=>{
      try { document.getElementById('js-out').textContent = JSON.stringify(JSON.parse(document.getElementById('js-in').value), null, 2); }
      catch(e) { document.getElementById('js-out').textContent = '❌ ' + e.message; }
    };
  }
};

// ==========================================
// ЯДРО ПАТЧЕРА ZILLA/RTX (0 СЕКУНД)
// ==========================================
async function patchMP4(buffer, zeroDuration, inflateTimescale){
  const data = new Uint8Array(buffer);
  const view = new DataView(data.buffer);
  
  function readBox(pos) {
    if(pos + 8 > data.length) return null;
    let size = view.getUint32(pos);
    const type = String.fromCharCode(data[pos+4], data[pos+5], data[pos+6], data[pos+7]);
    let hs = 8;
    if(size === 1){ size = Number(view.getBigUint64(pos+8)); hs = 16; }
    return {size, type, hs, start: pos};
  }

  function findBox(start, end, target){
    let ptr = start;
    while(ptr < end){
      const b = readBox(ptr);
      if(!b || b.size < 8) break;
      if(b.type === target) return b;
      ptr += b.size;
    }
    return null;
  }

  const moov = findBox(0, data.length, 'moov');
  if(!moov) throw new Error('Файл повреждён или это не MP4 (нет moov)');

  // 1. Патч mvhd (Movie Header)
  const mvhd = findBox(moov.start + moov.hs, moov.start + moov.size, 'mvhd');
  if(mvhd) {
    const off = mvhd.start + mvhd.hs;
    const v = data[off]; // version
    
    if(zeroDuration) {
      // Обнуляем duration
      if(v === 0) { view.setUint32(off + 16, 0); } 
      else if(v === 1) { view.setBigUint64(off + 24, 0n); }
    }
    
    if(inflateTimescale) {
      // Меняем timescale на нестандартный, чтобы сбить парсер
      if(v === 0) { view.setUint32(off + 12, 90000); }
      else if(v === 1) { view.setUint32(off + 20, 90000); }
    }
  }

  // 2. Патч mdhd (Media Header) внутри trak
  let trak = findBox(moov.start + moov.hs, moov.start + moov.size, 'trak');
  while(trak){
    const mdia = findBox(trak.start + trak.hs, trak.start + trak.size, 'mdia');
    if(mdia){
      const mdhd = findBox(mdia.start + mdia.hs, mdia.start + mdia.size, 'mdhd');
      if(mdhd){
        const off = mdhd.start + mdhd.hs;
        const v = data[off];
        
        if(zeroDuration) {
          if(v === 0) { view.setUint32(off + 16, 0); }
          else if(v === 1) { view.setBigUint64(off + 24, 0n); }
        }
        
        if(inflateTimescale) {
          if(v === 0) { view.setUint32(off + 12, 90000); }
          else if(v === 1) { view.setUint32(off + 20, 90000); }
        }
      }
    }
    trak = findBox(trak.start + trak.size, moov.start + moov.size, 'trak');
  }

  // 3. Небольшой трюк для сброса MD5 хеша файла, чтобы TikTok не видел дубликат
  // (Просто добавляем нулевой байт в конец, это не влияет на видео)
  const paddedLength = data.length + 1024; 
  const paddedData = new Uint8Array(paddedLength);
  paddedData.set(data);
  // Оставляем конец нулевым (padding)

  return paddedData;
}
